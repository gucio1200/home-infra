---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mcp-api-key
    creationPolicy: Owner
  data:
    - secretKey: claude-code
      remoteRef:
        key: mcp-gateway
        property: claude_code
