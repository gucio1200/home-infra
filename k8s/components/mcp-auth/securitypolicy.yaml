---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: "${MCP_AUTH_ROUTE:-${APP}}-auth"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: "${MCP_AUTH_ROUTE:-${APP}}"
  apiKeyAuth:
    credentialRefs:
      - name: "${MCP_AUTH_ROUTE:-${APP}}-auth"
    extractFrom:
      - headers:
          - x-mcp-key
    sanitize: true
