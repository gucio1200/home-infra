---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp-auth
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        mcp-auth: enabled
  apiKeyAuth:
    credentialRefs:
      - name: mcp-api-key
    extractFrom:
      - headers:
          - x-mcp-key
    sanitize: true
