---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: snmp-synology
spec:
  staticConfigs:
    - targets:
        - nfs.dom.lan
        - nfs2.dom.lan
  metricsPath: /snmp
  params:
    module: [synology]
    auth: [nas]
  scrapeInterval: 5m
  scrapeTimeout: 60s
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter.monitoring.svc.cluster.local:9116
    - targetLabel: job
      replacement: snmp-synology
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: snmp-qnap
spec:
  staticConfigs:
    - targets:
        - qnap.dom.lan
  metricsPath: /snmp
  params:
    module: [qnap]
    auth: [nas]
  scrapeInterval: 5m
  scrapeTimeout: 60s
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter.monitoring.svc.cluster.local:9116
    - targetLabel: job
      replacement: snmp-qnap
