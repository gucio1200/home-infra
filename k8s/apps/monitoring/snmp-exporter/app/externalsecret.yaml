---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp-exporter
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: snmp-exporter-auths
    creationPolicy: Owner
    template:
      data:
        auths.yaml: |
          auths:
            nas:
              community: "{{ .community }}"
              security_level: noAuthNoPriv
              version: 2
  data:
    - secretKey: community
      remoteRef:
        key: snmp
        property: community
