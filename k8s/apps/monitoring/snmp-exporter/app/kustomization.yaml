---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./scrapeconfig.yaml
configMapGenerator:
  - name: snmp-exporter-modules
    files:
      - snmp.yaml=./resources/snmp.yaml
generatorOptions:
  disableNameSuffixHash: true
