[agent]
  interval = "30s"
  flush_interval = "10s"
  omit_hostname = true
  metric_batch_size = 5000
  metric_buffer_limit = 100000

[[inputs.netflow]]
  service_address = "udp://:2055"
  protocol = "ipfix"

[[processors.starlark]]
  order = 1
  namepass = ["netflow"]
  script = "/config/wan.star"

[[processors.reverse_dns]]
  order = 2
  namepass = ["wan"]
  cache_ttl = "1h"
  lookup_timeout = "3s"
  max_parallel_lookups = 10
  [[processors.reverse_dns.lookup]]
    tag = "ip"
    dest = "name"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "0s"
  namepass = ["wan"]
