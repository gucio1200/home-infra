---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: wan-flow-config
    files:
      - telegraf.conf=./resources/telegraf.conf
      - wan.star=./resources/wan.star
generatorOptions:
  disableNameSuffixHash: true
