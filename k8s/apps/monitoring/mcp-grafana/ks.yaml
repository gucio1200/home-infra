---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-grafana
  namespace: flux-system
spec:
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: mcp-grafana
  components:
    - ../../../../components/mcp-auth
  interval: 10m
  path: "./k8s/apps/monitoring/mcp-grafana/app"
  postBuild:
    substitute:
      APP: mcp-grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: grafana
