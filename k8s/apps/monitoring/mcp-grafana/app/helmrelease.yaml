---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-grafana
spec:
  chartRef:
    kind: OCIRepository
    name: mcp-grafana
  interval: 1h
  values:
    controllers:
      mcp-grafana:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/grafana/mcp-grafana
              tag: 1.5.1@sha256:07c6614a8f8b6477e572444874c8c07baf145473977f014497cb59262af1944c
            command: ["/app/mcp-grafana"]
            args:
              - -t
              - streamable-http
              - -address
              - 0.0.0.0:8000
              - -healthz-address
              - :8080
              - -disable-write
              - -enabled-tools
              - search,datasource,prometheus,loki,alerting,dashboard,folder,navigation,annotations
              - -allowed-hosts
              - mcp-grafana.k8sj.io,mcp-grafana.monitoring.svc.cluster.local:8000,mcp-grafana.monitoring.svc:8000,mcp-grafana.monitoring:8000,mcp-grafana:8000
            env:
              GRAFANA_URL: http://grafana.monitoring.svc.cluster.local
              GRAFANA_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: grafana
                    key: admin-user
              GRAFANA_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: grafana
                    key: admin-password
              TZ: Europe/Warsaw
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &healthPort 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *healthPort
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: &port 8000
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.k8sj.io"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /mcp
            backendRefs:
              - identifier: app
                port: *port
          - backendRefs:
              - identifier: app
                port: *port
