---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: gemini-3-8-flash
spec:
  modelName: gemini-3.8-flash
  params:
    model: gemini/gemini-3.8-flash
    apiKeyRef:
      name: litellm-secret
      key: GEMINI_API_KEY
    dropParams: true
    additional:
      additional_drop_params:
        - temperature
        - top_p
        - top_k
  info:
    supportsFunctionCalling: true
    supportsPromptCaching: true
