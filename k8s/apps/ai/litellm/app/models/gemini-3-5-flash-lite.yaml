  params:
    model: gemini/gemini-3.5-flash-lite
    apiKeyRef:
      name: litellm-secret
      key: GEMINI_API_KEY
    dropParams: true
    additional:
      additional_drop_params:
        - temperature
        - top_p
        - top_k
  info:
