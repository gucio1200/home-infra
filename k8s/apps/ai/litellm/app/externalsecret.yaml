---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm-secret
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .litellm_master_key }}"
        OPENCODE_GO_API_KEY: "{{ .litellm_opencode_api_key }}"
        GEMINI_API_KEY: "{{ .litellm_gemini_api_key }}"
        ANTHROPIC_API_KEY: "{{ .litellm_anthropic_api_key }}"
  dataFrom:
    - extract:
        key: litellm
      rewrite:
        - regexp:
            source: "(.*)"
            target: "litellm_$1"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  target:
    name: litellm-db-secret
    template:
      type: Opaque
      data:
        DATABASE_URL: '{{ index . "uri" }}'
  dataFrom:
    - extract:
        key: postgres-pguser-litellm
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: litellm-salt
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-salt
spec:
  refreshPolicy: CreatedOnce
  target:
    name: litellm-salt-secret
    template:
      data:
        LITELLM_SALT_KEY: "sk-{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: litellm-salt
