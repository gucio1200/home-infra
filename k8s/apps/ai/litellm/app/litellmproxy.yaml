---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: file
  image: docker.io/litellm/litellm-non_root:v1.106.6@sha256:6363e53f135dafbf4a68fac25f77aec3f2b99be37665e8c5f623a952637c220b
  replicas: 1
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  env:
    - name: TZ
      value: Europe/Warsaw
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly
    - name: REDIS_PORT
      value: "6379"
    - name: PYTHONPATH
      value: /app/hooks
  envFrom:
    - secretRef:
        name: litellm-secret
    - secretRef:
        name: litellm-db-secret
    - secretRef:
        name: litellm-salt-secret
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 2Gi
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  volumes:
    - name: hooks
      configMap:
        name: litellm-hooks
    - name: tmpfs
      emptyDir: {}
  volumeMounts:
    - name: hooks
      mountPath: /app/hooks
      readOnly: true
    - name: tmpfs
      mountPath: /cache
      subPath: cache
    - name: tmpfs
      mountPath: /tmp
      subPath: tmp
  generalSettings:
    health_check_endpoint: /v1/health
    use_x_forwarded_for: true
    trusted_proxy_ranges:
      - 10.244.0.0/16
      - 192.168.0.0/16
    mcp_trusted_proxy_ranges:
      - 10.244.0.0/16
      - 192.168.0.0/16
    mcp_xff_num_trusted_hops: 1
  routerSettings:
    routing_strategy: simple-shuffle
    redis_url: os.environ/REDIS_URL
    redis_port: os.environ/REDIS_PORT
    fallbacks:
      - ha-assist:
          - gpt-6-luna
          - gemini-4-argon
    model_group_retry_policy:
      ha-assist:
        DefaultRetries: 0
  callbacks:
    success:
      - prometheus
    callbacks:
      - opencode_session.proxy_handler_instance
      - ha_assist_prompt.proxy_handler_instance
  litellmSettings:
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
    drop_params: false
    request_timeout: 600
    num_retries: 2
    retry_after: 5
    set_verbose: false
  extraConfig:
    environment:
      - OPENCODE_GO_API_KEY
      - REDIS_HOST
      - REDIS_PORT
      - GEMINI_API_KEY
      - ANTHROPIC_API_KEY
