---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: litellm
  values:
    controllers:
      litellm:
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/litellm/litellm-non_root
              tag: v1.106.6@sha256:6363e53f135dafbf4a68fac25f77aec3f2b99be37665e8c5f623a952637c220b
            args: ["--config=/app/config.yaml"]
            env:
              TZ: "Europe/Warsaw"
              LITELLM_LOG: INFO
              LITELLM_MODE: PRODUCTION
              REDIS_HOST: litellm-dragonfly
              REDIS_PORT: 6379
            envFrom:
              - secretRef:
                  name: litellm-secret
              - secretRef:
                  name: litellm-db-secret
              - secretRef:
                  name: litellm-salt-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 4000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: litellm
        endpoints:
          - port: http
            scheme: http
            path: /metrics/
            interval: 1m
            scrapeTimeout: 30s
            authorization:
              type: Bearer
              credentials:
                name: litellm-secret
                key: LITELLM_MASTER_KEY
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: LiteLLM
          gethomepage.dev/group: AI
          gethomepage.dev/icon: sh-litellm.png
          gethomepage.dev/name: LiteLLM
          gethomepage.dev/app: litellm
          gethomepage.dev/href: https://litellm.k8sj.io/ui
        hostnames:
          - "{{ .Release.Name }}.k8sj.io"
        parentRefs:
          - name: envoy-internal
            namespace: networking
    persistence:
      config:
        type: configMap
        name: litellm-configmap
        globalMounts:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
          - path: /app/opencode_session.py
            subPath: opencode_session.py
            readOnly: true
          - path: /app/ha_assist_prompt.py
            subPath: ha_assist_prompt.py
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /cache
            subPath: cache
          - path: /tmp
            subPath: tmp
