---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: litellm-configmap
    files:
      - config.yaml=./resources/config.yaml
      - opencode_session.py=./resources/opencode_session.py
      - ha_assist_prompt.py=./resources/ha_assist_prompt.py
generatorOptions:
  disableNameSuffixHash: true
