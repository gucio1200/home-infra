---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-proxy
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: LiteLLM
    gethomepage.dev/group: AI
    gethomepage.dev/icon: sh-litellm.png
    gethomepage.dev/name: LiteLLM
    gethomepage.dev/app: litellm
    gethomepage.dev/href: https://litellm.k8sj.io/ui
spec:
  hostnames:
    - litellm.k8sj.io
  parentRefs:
    - name: envoy-internal
      namespace: networking
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
