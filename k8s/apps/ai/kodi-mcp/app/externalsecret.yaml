---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kodi-mcp
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kodi-mcp
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kodi-mcp-secret
    template:
      data:
        KODIMCP_Server__Password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kodi-mcp
