---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: kodi-mcp-configmap
    files:
      - KodiMCPSharp.json=./resources/KodiMCPSharp.json
generatorOptions:
  disableNameSuffixHash: true
