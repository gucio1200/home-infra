---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-internal
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
  embeddingServerRef:
    name: mcp-tools-embedding
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-ha
spec:
  groupRef:
    name: mcp-ha
  config:
    aggregation:
      tools:
        - workload: kodi-ha
          filter:
            - kodi_add_favourite
            - kodi_bind_addon_route
            - kodi_browse
            - kodi_browse_movie_set
            - kodi_browse_tv_show
            - kodi_capture_current_addon_page
            - kodi_get_queue
            - kodi_get_status
            - kodi_get_video_details
            - kodi_list_addon_routes
            - kodi_list_addons
            - kodi_list_continue_watching
            - kodi_list_favourites
            - kodi_list_genres
            - kodi_list_movie_sets
            - kodi_list_pvr_channels
            - kodi_list_pvr_recordings
            - kodi_list_pvr_timers
            - kodi_list_recent
            - kodi_list_recently_played_music
            - kodi_list_recently_watched_movies
            - kodi_list_recently_watched_shows
            - kodi_list_up_next
            - kodi_list_video_tags
            - kodi_move_queue_item
            - kodi_play_episode
            - kodi_play_item
            - kodi_play_movie
            - kodi_play_music
            - kodi_play_next_episode
            - kodi_play_pvr
            - kodi_play_random
            - kodi_player_control
            - kodi_playlist_add
            - kodi_playlist_clear
            - kodi_playlist_remove
            - kodi_remove_favourite
            - kodi_resume
            - kodi_save_addon_route
            - kodi_search_favourites
            - kodi_search_library
            - kodi_seek
            - kodi_select_stream
            - kodi_set_episode_watch_state
            - kodi_set_playback_mode
            - kodi_set_volume
            - kodi_show_fullscreen_video
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
