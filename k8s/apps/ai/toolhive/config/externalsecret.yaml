---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ghostfolio-mcp-secret
    template:
      data:
        AUTHORIZATION: "Bearer {{ .mcp_token }}"
  data:
    - secretKey: mcp_token
      remoteRef:
        key: ghostfolio
        property: mcp_token
