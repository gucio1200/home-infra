---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: ghostcompanion-coinbase-patch
    files:
      - ./ghostcompanion/coinbase.py
  - name: ghostfolio-xtb-import-script
    files:
      - ./xtb-import/xtb_import.py
generatorOptions:
  disableNameSuffixHash: true
