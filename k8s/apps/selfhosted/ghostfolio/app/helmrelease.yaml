---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ghostfolio
spec:
  chartRef:
    kind: OCIRepository
    name: ghostfolio
  interval: 30m
  values:
    controllers:
      ghostfolio:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: docker.io/ghostfolio/ghostfolio
              tag: 3.100.0
            env:
              TZ: Europe/Warsaw
              ROOT_URL: https://ghostfolio.k8sj.io
              SSL_CERT_FILE: /etc/postgres-ca/ca.crt
              REDIS_HOST: 127.0.0.1
              REDIS_PORT: 6379
            envFrom:
              - secretRef:
                  name: ghostfolio-secret
              - secretRef:
                  name: ghostfolio-db-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 3333
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi

          valkey:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.3-alpine
            args:
              - --bind
              - 127.0.0.1
              - --port
              - "6379"
              - --save
              - ""
              - --appendonly
              - "no"
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 128Mi

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      pg-ca:
        type: secret
        name: ghostfolio-pg-ca
        advancedMounts:
          ghostfolio:
            app:
              - path: /etc/postgres-ca
                readOnly: true

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Portfolio tracker
          gethomepage.dev/group: Finance
          gethomepage.dev/icon: sh-ghostfolio.png
          gethomepage.dev/name: Ghostfolio
          gethomepage.dev/app: ghostfolio
        hostnames:
          - ghostfolio.k8sj.io
        parentRefs:
          - name: envoy-internal
            namespace: networking
