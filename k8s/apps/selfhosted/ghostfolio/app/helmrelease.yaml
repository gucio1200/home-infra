---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ghostfolio
spec:
  chartRef:
    kind: OCIRepository
    name: ghostfolio
  interval: 30m
  values:
    controllers:
      ghostfolio:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: docker.io/ghostfolio/ghostfolio
              tag: 3.100.0
            env:
              TZ: Europe/Warsaw
              ROOT_URL: https://ghostfolio.k8sj.io
              SSL_CERT_FILE: /etc/postgres-ca/ca.crt
              ENABLE_FEATURE_MCP: "true"
              REDIS_HOST: 127.0.0.1
              REDIS_PORT: 6379
            envFrom:
              - secretRef:
                  name: ghostfolio-secret
              - secretRef:
                  name: ghostfolio-db-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 3333
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi

          valkey:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.2.0-alpine
            args:
              - --bind
              - 127.0.0.1
              - --port
              - "6379"
              - --save
              - ""
              - --appendonly
              - "no"
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 128Mi

      xtb-import:
        type: cronjob
        cronjob:
          schedule: "*/10 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
          backoffLimit: 0

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 100

        containers:
          app:
            image:
              repository: docker.io/dickwolff/export-to-ghostfolio
              tag: 0.34.2
            env:
              HOME: /tmp
              GHOSTFOLIO_ACCOUNT_ID: 50c0b6e2-2b57-4ddd-bdbf-8cc24280262b
              GHOSTFOLIO_URL: https://ghostfolio.k8sj.io
              GHOSTFOLIO_VALIDATE: "true"
              GHOSTFOLIO_IMPORT: "true"
              GHOSTFOLIO_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ghostfolio-importer-secret
                    key: GHOSTFOLIO_SECRET
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

      coinbase-sync:
        type: cronjob
        cronjob:
          schedule: "15 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
          backoffLimit: 0

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

        containers:
          app:
            image:
              repository: docker.io/olirafa/ghostcompanion
              tag: 3.4.1
            env:
              HOME: /tmp
              GHOSTFOLIO_BASE_URL: https://ghostfolio.k8sj.io
            envFrom:
              - secretRef:
                  name: ghostfolio-coinbase-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: ghostfolio
        ports:
          http:
            port: *port

    persistence:
      pg-ca:
        type: secret
        name: ghostfolio-pg-ca
        advancedMounts:
          ghostfolio:
            app:
              - path: /etc/postgres-ca
                readOnly: true
      xtb:
        type: nfs
        server: qnap.dom.lan
        path: /Share
        advancedMounts:
          xtb-import:
            app:
              - path: /var/tmp/e2g-input
                subPath: Inwestycje/XTB/import
              - path: /var/tmp/e2g-output
                subPath: Inwestycje/XTB/przetworzone
      e2g-cache:
        type: emptyDir
        advancedMounts:
          xtb-import:
            app:
              - path: /var/tmp/e2g-cache
      ghostcompanion-patch:
        type: configMap
        name: ghostcompanion-coinbase-patch
        advancedMounts:
          coinbase-sync:
            app:
              - path: /app/ghostcompanion/core/provider/coinbase.py
                subPath: coinbase.py
                readOnly: true

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Portfolio tracker
          gethomepage.dev/group: Finance
          gethomepage.dev/icon: sh-ghostfolio.png
          gethomepage.dev/name: Ghostfolio
          gethomepage.dev/app: ghostfolio
        hostnames:
          - ghostfolio.k8sj.io
        parentRefs:
          - name: envoy-internal
            namespace: networking
