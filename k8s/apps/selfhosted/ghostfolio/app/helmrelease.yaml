---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ghostfolio
spec:
  chartRef:
    kind: OCIRepository
    name: ghostfolio
  interval: 30m
  values:
    controllers:
      ghostfolio:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: docker.io/ghostfolio/ghostfolio
              tag: 3.100.0
            env:
              TZ: Europe/Warsaw
              ROOT_URL: https://ghostfolio.k8sj.io
              SSL_CERT_FILE: /etc/postgres-ca/ca.crt
              ENABLE_FEATURE_MCP: "true"
              REDIS_HOST: 127.0.0.1
              REDIS_PORT: 6379
            envFrom:
              - secretRef:
                  name: ghostfolio-secret
              - secretRef:
                  name: ghostfolio-db-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 3333
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi

          valkey:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.2.0-alpine
            args:
              - --bind
              - 127.0.0.1
              - --port
              - "6379"
              - --save
              - ""
              - --appendonly
              - "no"
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 128Mi

      xtb-import:
        type: cronjob
        cronjob:
          schedule: "*/10 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
          backoffLimit: 0

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 100

        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
            command:
              - python
              - -I
              - /app/xtb_import.py
            env:
              HOME: /tmp
              TZ: Europe/Warsaw
              PYTHONDONTWRITEBYTECODE: "1"
              GHOSTFOLIO_URL: https://ghostfolio.k8sj.io
              GHOSTFOLIO_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ghostfolio-importer-secret
                    key: GHOSTFOLIO_SECRET
              XTB_INPUT_DIR: /data/import
              XTB_OUTPUT_DIR: /data/przetworzone
              XTB_HA_WEBHOOK_URL: http://home-assistant-app.home-automation.svc.cluster.local:8123/api/webhook
              XTB_HA_WEBHOOK_ID:
                valueFrom:
                  secretKeyRef:
                    name: ghostfolio-xtb-webhook-secret
                    key: XTB_HA_WEBHOOK_ID
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

      coinbase-sync:
        type: cronjob
        cronjob:
          schedule: "15 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
          backoffLimit: 0

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

        containers:
          app:
            image:
              repository: docker.io/olirafa/ghostcompanion
              tag: 3.4.1
            env:
              HOME: /tmp
              GHOSTFOLIO_BASE_URL: https://ghostfolio.k8sj.io
            envFrom:
              - secretRef:
                  name: ghostfolio-coinbase-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: ghostfolio
        ports:
          http:
            port: *port

    persistence:
      pg-ca:
        type: secret
        name: ghostfolio-pg-ca
        advancedMounts:
          ghostfolio:
            app:
              - path: /etc/postgres-ca
                readOnly: true
      xtb:
        type: nfs
        server: qnap.dom.lan
        path: /Share
        advancedMounts:
          xtb-import:
            app:
              - path: /data/import
                subPath: Inwestycje/XTB/import
              - path: /data/przetworzone
                subPath: Inwestycje/XTB/przetworzone
      xtb-import-script:
        type: configMap
        name: ghostfolio-xtb-import-script
        advancedMounts:
          xtb-import:
            app:
              - path: /app/xtb_import.py
                subPath: xtb_import.py
                readOnly: true
      ghostcompanion-patch:
        type: configMap
        name: ghostcompanion-coinbase-patch
        advancedMounts:
          coinbase-sync:
            app:
              - path: /app/ghostcompanion/core/provider/coinbase.py
                subPath: coinbase.py
                readOnly: true

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Portfolio tracker
          gethomepage.dev/group: Finance
          gethomepage.dev/icon: sh-ghostfolio.png
          gethomepage.dev/name: Ghostfolio
          gethomepage.dev/app: ghostfolio
        hostnames:
          - ghostfolio.k8sj.io
        parentRefs:
          - name: envoy-internal
            namespace: networking
