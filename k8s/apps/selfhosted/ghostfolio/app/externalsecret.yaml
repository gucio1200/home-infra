---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  target:
    name: ghostfolio-db-secret
    template:
      type: Opaque
      data:
        DATABASE_URL: '{{ index . "uri" }}?connect_timeout=300&sslmode=disable'
  dataFrom:
    - extract:
        key: postgres-pguser-ghostfolio
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ghostfolio
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ghostfolio-secret
    template:
      data:
        ACCESS_TOKEN_SALT: "{{ .salt_password }}"
        JWT_SECRET_KEY: "{{ .jwt_password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ghostfolio
      rewrite:
        - regexp:
            source: "(.*)"
            target: "salt_$1"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ghostfolio
      rewrite:
        - regexp:
            source: "(.*)"
            target: "jwt_$1"
