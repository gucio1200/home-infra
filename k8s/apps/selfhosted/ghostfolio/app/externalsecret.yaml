---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  target:
    name: ghostfolio-db-secret
    template:
      type: Opaque
      data:
        DATABASE_URL: '{{ index . "uri" }}?connect_timeout=300&sslmode=require&sslaccept=strict&sslrootcert=/etc/postgres-ca/ca.crt'
  dataFrom:
    - extract:
        key: postgres-pguser-ghostfolio
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-pg-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  target:
    name: ghostfolio-pg-ca
    template:
      type: Opaque
      data:
        ca.crt: '{{ index . "ca.crt" }}'
  dataFrom:
    - extract:
        key: postgres-cluster-cert
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ghostfolio
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ghostfolio-secret
    template:
      data:
        ACCESS_TOKEN_SALT: "{{ .salt_password }}"
        JWT_SECRET_KEY: "{{ .jwt_password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ghostfolio
      rewrite:
        - regexp:
            source: "(.*)"
            target: "salt_$1"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ghostfolio
      rewrite:
        - regexp:
            source: "(.*)"
            target: "jwt_$1"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-xtb-webhook
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ghostfolio-xtb-webhook-secret
    template:
      data:
        XTB_HA_WEBHOOK_ID: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ghostfolio
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-importer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ghostfolio-importer-secret
    template:
      data:
        GHOSTFOLIO_SECRET: "{{ .security_token }}"
  data:
    - secretKey: security_token
      remoteRef:
        key: ghostfolio
        property: security_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-coinbase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ghostfolio-coinbase-secret
    template:
      data:
        GHOSTFOLIO_ACCOUNT_TOKEN: "{{ .security_token }}"
        COINBASE_API_KEY_ID: "{{ .coinbase_key }}"
        COINBASE_SECRET: |-
          {{ .coinbase_pass | replace "\\n" "\n" }}
  data:
    - secretKey: security_token
      remoteRef:
        key: ghostfolio
        property: security_token
    - secretKey: coinbase_key
      remoteRef:
        key: ghostfolio
        property: coinbase_key
    - secretKey: coinbase_pass
      remoteRef:
        key: ghostfolio
        property: coinbase_pass
