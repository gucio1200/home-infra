---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-mcp-secret
    creationPolicy: Owner
    template:
      data:
        UNIFI_NETWORK_USERNAME: "{{ .username }}"
        UNIFI_NETWORK_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: unifi-mcp
