---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mikrotik-mcp-secret
    creationPolicy: Owner
    template:
      data:
        MIKROTIK_INVENTORY: |-
          [
            {"title": {{ .mikrotik_mcp_host | toJson }}, "host": {{ .mikrotik_mcp_host | toJson }}, "username": {{ .mikrotik_mcp_username | toJson }}, "password": {{ .mikrotik_mcp_password | toJson }}},
            {"title": {{ .mikrotik_mcp_vpn_host | toJson }}, "host": {{ .mikrotik_mcp_vpn_host | toJson }}, "username": {{ .mikrotik_mcp_vpn_username | toJson }}, "password": {{ .mikrotik_mcp_vpn_password | toJson }}}
          ]
  dataFrom:
    - extract:
        key: mikrotik-mcp
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9-]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "mikrotik_mcp_$1"
