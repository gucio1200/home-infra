---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mikrotik-mcp-secret
    creationPolicy: Owner
    template:
      data:
        MIKROTIK_INVENTORY: |-
          {{- $inventory := list -}}
          {{- range $host := regexSplit `[\s,;]+` .mikrotik_mcp_host -1 | compact | uniq -}}
          {{- $inventory = append $inventory (dict "title" $host "host" $host "username" $.mikrotik_mcp_username "password" $.mikrotik_mcp_password) -}}
          {{- end -}}
          {{- toJson $inventory -}}
  dataFrom:
    - extract:
        key: mikrotik-mcp
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9-]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "mikrotik_mcp_$1"
