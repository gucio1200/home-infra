---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-mcp-secret
    template:
      data:
        HOMEASSISTANT_TOKEN: "{{ .HASS_MCP_TOKEN }}"
  dataFrom:
    - extract:
        key: home-assistant-mcp
