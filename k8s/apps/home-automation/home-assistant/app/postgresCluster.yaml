---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: assistant
  namespace: home-automation
spec:
  postgresVersion: 17
  shutdown: false
  dataSource:
    pgbackrest:
      stanza: db
      configuration:
        - secret:
            name: pgo-s3-creds
      global:
        repo1-path: /home-assistant/repo1
        repo1-s3-uri-style: path
        repo1-storage-verify-tls: "n"
      repo:
        name: repo1
        s3:
          bucket: "crunchy-postgres"
          endpoint: "s3.dom.lan:9001"
          region: "us-east-1"
      options:
        - --type=immediate
  patroni:
    dynamicConfiguration:
      synchronous_mode: true
      postgresql:
        synchronous_commit: "on"
  instances:
    - name: postgres
      # A second instance lets Patroni fail over within seconds instead of the recorder losing the database
      replicas: 2
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 15Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  postgres-operator.crunchydata.com/cluster: assistant
                  postgres-operator.crunchydata.com/instance-set: postgres
  users:
    - name: home-assistant
      databases:
        - home-assistant
      options: "SUPERUSER"
  backups:
    pgbackrest:
      configuration:
        - secret:
            name: pgo-s3-creds
      global:
        archive-push-queue-max: 4GiB
        io-timeout: "300"
        repo1-retention-full: "14"
        repo1-retention-full-type: time
        repo1-retention-diff: "24"
        repo1-path: /home-assistant/repo1
        repo1-s3-uri-style: path
        repo1-storage-verify-tls: "n"
      manual:
        repoName: repo1
        options:
          - --type=full
      repos:
        - name: repo1
          schedules:
            full: "0 1 * * *" # Daily at 01:00
            differential: "0 2-23 * * *" # Every hour except 01:00, so it never collides with the full backup
          s3:
            bucket: "crunchy-postgres"
            endpoint: "s3.dom.lan:9001"
            region: "us-east-1"
