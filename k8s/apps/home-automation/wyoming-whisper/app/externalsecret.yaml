---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wyoming-whisper
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: wyoming-whisper-secret
    template:
      data:
        WYO_WHISPER_HASS_TOKEN: "{{ .HASS_MCP_TOKEN }}"
  dataFrom:
    - extract:
        key: home-assistant-mcp
