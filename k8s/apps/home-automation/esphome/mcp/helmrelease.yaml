---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: esphome-mcp
  interval: 1h
  values:
    controllers:
      esphome-mcp:
        containers:
          app:
            image:
              repository: ghcr.io/loryanstrant/esphome-mcp
              tag: 2026.09.0@sha256:1bcc357d9630c49e3b55766c427e0323c5e686c5f41fc1cf37c6b1ce329f253e
            env:
              ESPHOME_DASHBOARD_URL: http://esphome.home-automation.svc.cluster.local:6052
              FASTMCP_CHECK_FOR_UPDATES: "off"
              LOG_LEVEL: INFO
              TZ: Europe/Warsaw
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python
                      - /app/healthcheck.py
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 3
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.k8sj.io"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
