---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname lingarr
  namespace: flux-system
spec:
  targetNamespace: downloads
  components:
    - ../../../../components/volsync
    - ../../../../components/keda/nfs-scaler
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  interval: 30m
  timeout: 5m
  path: "./k8s/apps/downloads/lingarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  dependsOn:
    - name: cluster-apps-rook-ceph-cluster
    - name: cluster-apps-volsync-app
    - name: onepassword-connect
    - name: crunchy-postgres-operator-cluster
    - name: crunchy-postgres-operator-secretstore
    - name: radarr
    - name: sonarr
  postBuild:
    substitute:
      APP: *appname
      VOLSYNC_CLAIM: *appname
      VOLSYNC_CAPACITY: 2Gi
