---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: protonvpn
spec:
  chartRef:
    kind: OCIRepository
    name: protonvpn
  interval: 30m
  values:
    controllers:
      protonvpn:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: protonvpn
        pod:
          automountServiceAccountToken: true
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "vpn-probe",
                "namespace": "networking",
                "ips": ["10.1.5.11/24"]
              }]
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 568
              - 100
        containers:
          app:
            nameOverride: wg
            image:
              repository: unixology/wg
              tag: "2a1d7ca"
            env:
              CHECK_URL: https://1.1.1.1/cdn-cgi/trace
              REGENERATE_ON_START: "true"
              SESSION_SECRET_NAME: &session protonvpn-session
              HTTP_ADDR: 0.0.0.0:8080
              COUNTRIES: EUROPE
              EXCLUDE_COUNTRIES: PL,RU
              TIER: "2"
              FEATURES: P2P,-SecureCore
              MAX_LOAD: "80"
            envFrom:
              - secretRef:
                  name: "protonvpn"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 2000
              runAsNonRoot: true
              runAsUser: 2000
    service:
      app:
        controller: protonvpn
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: protonvpn
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    serviceAccount:
      protonvpn: {}
    rbac:
      roles:
        protonvpn:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - secrets
              resourceNames:
                - *session
              verbs:
                - get
                - patch
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - create
      bindings:
        protonvpn:
          type: RoleBinding
          roleRef:
            identifier: protonvpn
          subjects:
            - identifier: protonvpn
