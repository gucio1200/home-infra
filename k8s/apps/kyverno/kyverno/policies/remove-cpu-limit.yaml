---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: remove-cpu-limit
  annotations:
    policies.kyverno.io/title: Remove CPU limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      This policy removes CPU limits from all Pods.
spec:
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  variables:
    - name: excluded
      expression: >-
        object.metadata.?annotations[?"kyverno-no-tz"].orValue("") == "true" ||
        object.metadata.?labels[?"app.kubernetes.io/created-by"].orValue("") == "volsync" ||
        object.metadata.?labels[?"job-name"].orValue("") != ""
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.excluded ? [] :
          lists.range(size(object.spec.containers))
            .filter(i, object.spec.containers[i].?resources.?limits.?cpu.hasValue())
            .map(i, JSONPatch{
              op: "remove",
              path: "/spec/containers/" + string(i) + "/resources/limits/cpu"
            })
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          lists.range(size(object.spec.?initContainers.orValue([])))
            .filter(i, object.spec.initContainers[i].?resources.?limits.?cpu.hasValue())
            .map(i, JSONPatch{
              op: "remove",
              path: "/spec/initContainers/" + string(i) + "/resources/limits/cpu"
            })
